# Funders the update agent checks. See AGENT.md.
# listing: the page that lists the funder's calls. "verify: true" means the URL is a
# starting point the agent should confirm (and correct here) on its first run.

sources:
  # --- Sweden: government agencies ---
  - name: Vetenskapsrådet (VR)
    region: SE
    listing: https://www.vr.se/english/applying-for-funding/calls-and-decisions/calls-as-rss-feed.html
    notes: Old listing URL returned 404. This page lists all calls with links to each call page.
    verify: true
  - name: Vinnova
    region: SE
    listing: https://www.vinnova.se/sok-finansiering/
    verify: true
  - name: Formas
    region: SE
    listing: https://formas.se/soka-finansiering/alla-utlysningar.html
    notes: Front page has no call list. Calls are on "Alla utlysningar" (this URL).
    verify: false
  - name: Forte
    region: SE
    listing: https://forte.se/sok-finansiering/utlysningar?status=Kommande
    notes: The call list page returned no calls to the agent (probably loaded by JavaScript). Not checked in a browser.
    verify: true
  - name: Energimyndigheten (Swedish Energy Agency)
    region: SE
    listing: https://www.energimyndigheten.se/
    notes: Front page lists open calls under "Utlysningar och stöd". Full list at /utlysningar/.
    verify: false
  - name: Rymdstyrelsen (Swedish National Space Agency)
    region: SE
    listing: https://www.rymdstyrelsen.se/forskning/utlysningar/aktiva-utlysningar/
    notes: Active research calls list. Most entries show a single date with no label, so they were not added.
    verify: false

  # --- Sweden: foundations and programmes ---
  - name: Stiftelsen för strategisk forskning (SSF)
    region: SE
    listing: https://strategiska.se/utlysningar/
    notes: Open calls list. Lists deadlines with years, but no opening dates.
    verify: false
  - name: Knut och Alice Wallenbergs Stiftelse (KAW)
    region: SE
    listing: https://kaw.wallenberg.org/
    notes: /utlysningar returns 404. Calls are on the front page, and the full list is at /anslagsguide/utlysningar (not checked). Dates are shown without years, so no calls were added.
    verify: true
  - name: Riksbankens Jubileumsfond (RJ)
    region: SE
    listing: https://www.rj.se/
    notes: No call list found in the page content (probably loaded by JavaScript). /utlysningar/ also returned nothing.
    verify: true
  - name: KK-stiftelsen
    region: SE
    listing: https://www.kks.se/finansiering/
    notes: Calls overview with deadlines and years (no opening dates).
    verify: false
  - name: Mistra
    region: SE
    listing: https://mistra.org/utlysningarna/
    notes: Calls list. Only completed calls on this page, so nothing open.
    verify: false
  - name: WASP
    region: SE
    listing: https://wasp-sweden.org/calls/
    notes: Calls list with open calls and deadlines (no opening dates).
    verify: false

  # --- EU ---
  - name: EU Funding & Tenders Portal (Horizon Europe, Digital Europe, LIFE, ...)
    region: EU
    listing: https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/calls-for-proposals
    api: https://api.tech.ec.europa.eu/search-api/prod/rest/search?apiKey=SEDIA
    notes: Public search API used by the portal. Filter on open and forthcoming calls for proposals.
    verify: true
  - name: European Research Council (ERC)
    region: EU
    listing: https://erc.europa.eu/apply-grant
    notes: Lists schemes only, no dates. Calls are in the EU portal (source api).
    verify: false
  - name: European Innovation Council (EIC)
    region: EU
    listing: https://eic.ec.europa.eu/
    notes: Front page has no call content in static HTML. EIC topics are in the EU portal (source api).
    verify: true
  - name: Eureka / Eurostars
    region: EU
    listing: https://www.eurekanetwork.org/
    notes: Returned 403 to the agent's fetch tool. Checked by web search only: no open Eurostars call found on 2026-11-13.
    verify: true
  - name: COST Actions
    region: EU
    listing: https://www.cost.eu/funding/open-call-a-simple-one-step-application-process/
    notes: The COST Open Call 2026 is closed; OC-2027 dates not yet published.
    verify: false
